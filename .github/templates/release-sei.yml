name: Release a sei

# Template for maintainers (ADR-0041). Copy it to
# `.github/workflows/release.yml`, adjust the build and the artifact paths, and
# it builds the packages, creates the release, then writes sei-index.json.
#
# The composite action comes from SeiIndex and runs with this repository's own
# permissions; nothing here needs access to the index repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - rid: win-x64
            archive: dist/hello-seiko-win-x64.zip
          - rid: linux-x64
            archive: dist/hello-seiko-linux-x64.zip
    steps:
      - uses: actions/checkout@v7

      - name: Build the payload
        run: |
          set -euo pipefail
          # Replace this with your own build. The archive root must contain
          # sei.json; everything else is payload.
          mkdir -p dist/stage
          cp sei.json dist/stage/
          cp -r payload dist/stage/
          mkdir -p dist
          (cd dist/stage && zip -qr "../hello-seiko-${{ matrix.rid }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: sei-${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes

      - name: Write sei-index.json
        uses: Hosihikari/SeiIndex/.github/actions/sei-release@main
        with:
          index-path: sei-index.json
          artifacts: |
            [
              {
                "rid": "win-x64",
                "path": "dist/hello-seiko-win-x64.zip",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/hello-seiko-win-x64.zip"
              },
              {
                "rid": "linux-x64",
                "path": "dist/hello-seiko-linux-x64.zip",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/hello-seiko-linux-x64.zip"
              }
            ]

      - name: Commit the file
        run: |
          set -euo pipefail
          if git diff --quiet -- sei-index.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sei-index.json
          git commit -m "sei: update sei-index.json for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
