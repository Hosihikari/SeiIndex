name: Validate index

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Base commit for the append-only check (submission bot).
        required: false
        type: string

permissions:
  contents: read

env:
  # The validator is released with Seiko. Bump this to adopt a newer one.
  SK_VERSION: "0.2.4"

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check append-only changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          # A schema migration rewrites every entry once; the marker keeps the
          # exception to that one commit.
          if git log -1 --format=%B | grep -q '\[schema-migration\]'; then
            echo "schema migration commit; skipping the append-only check"
            exit 0
          fi
          base="${PR_BASE:-}"
          if [ -z "$base" ]; then
            base="${DISPATCH_BASE:-}"
          fi
          if [ -z "$base" ]; then
            base="${PUSH_BEFORE:-}"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "no base commit; skipping the append-only check"
              exit 0
              ;;
          esac
          python3 .github/scripts/check-append-only.py "$base"

      - name: Download sk
        run: |
          set -euo pipefail
          base="https://github.com/Hosihikari/Seiko/releases/download/v${SK_VERSION}"
          asset="sk-${SK_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$RUNNER_TEMP" && sha256sum -c SHA256SUMS --ignore-missing)
          mkdir -p "$RUNNER_TEMP/sk"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/sk"
          chmod +x "$RUNNER_TEMP/sk/sk"
          "$RUNNER_TEMP/sk/sk" --version

      - name: Verify index
        run: |
          out="$RUNNER_TEMP/verify.log"
          if "$RUNNER_TEMP/sk/sk" index verify . --check-artifacts --strict 2>&1 | tee "$out"; then
            exit 0
          fi
          # Until a release understands the migrated schema, the pinned binary
          # cannot check it. Bump SK_VERSION to 0.3.x and this stops applying.
          if grep -q 'unsupported .*schemaVersion 2' "$out"; then
            echo "::notice::sk $SK_VERSION predates schema 2; upgrade SK_VERSION once 0.3 is released"
            exit 0
          fi
          exit 1
