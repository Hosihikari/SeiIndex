name: Auto-merge index entries

# Runs from the base branch, never checks out or executes pull request code.
# Members' and bots' data-only pull requests get GitHub auto-merge; external
# data-only pull requests are redirected to the submission issue form. The
# merge itself waits for the required "validate" check from Validate index.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    steps:
      - name: Check changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ASSOC: ${{ github.event.pull_request.author_association }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          paths=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          allowed=true
          if [ -z "$paths" ]; then
            allowed=false
            echo "no changed files"
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              index.json) ;;
              sei/*.json)
                if ! printf '%s' "$path" | grep -Eq '^sei/[^/]+\.json$'; then
                  allowed=false
                fi
                ;;
              *)
                allowed=false
                ;;
            esac
            if [ "$allowed" = false ]; then
              echo "manual review required: $path"
              break
            fi
          done <<< "$paths"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

          trusted=false
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) trusted=true ;;
          esac
          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            trusted=true
          fi
          if [ "$trusted" != true ]; then
            permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || true)
            case "$permission" in
              admin|maintain|write) trusted=true ;;
            esac
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.files.outputs.allowed == 'true' && steps.files.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$REPO" --squash --auto

      - name: Redirect external submissions
        if: steps.files.outputs.allowed == 'true' && steps.files.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="SeiIndex accepts submissions through the issue form, not pull requests. Please open https://github.com/$REPO/issues/new?template=sei-submission.yml; the index bot will prepare the entry and open a pull request for you."
          gh pr comment "$PR" --repo "$REPO" --body "$body"
          gh pr close "$PR" --repo "$REPO"
