name: Auto-merge index entries

# Runs from the base branch, never checks out or executes pull request code,
# and only opts data-only pull requests into GitHub auto-merge. The merge
# itself waits for the required "validate" check from Validate index.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    steps:
      - name: Check changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          paths=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          allowed=true
          if [ -z "$paths" ]; then
            allowed=false
            echo "no changed files"
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              index.json) ;;
              sei/*.json)
                if ! printf '%s' "$path" | grep -Eq '^sei/[^/]+\.json$'; then
                  allowed=false
                fi
                ;;
              *)
                allowed=false
                ;;
            esac
            if [ "$allowed" = false ]; then
              echo "manual review required: $path"
              break
            fi
          done <<< "$paths"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.files.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$REPO" --squash --auto
